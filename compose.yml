name: autorent

services:
  backend:
    build:
      context: ./Backend
    container_name: autorent-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - autorent-net
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    container_name: autorent-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - autorent-net
    restart: unless-stopped

networks:
  autorent-net:
    driver: bridge